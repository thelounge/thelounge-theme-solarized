name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Build and test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test
